name: 매일 브리핑

permissions:
  contents: write

on:
  schedule:
    - cron: "30 22 * * *"       # UTC 22:30 = KST 07:30
  workflow_dispatch:
    inputs:
      dry_run:
        description: "발행하지 않고 로그만 남기기"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 브리핑 생성·발행
        run: python run.py ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
          TZ: Asia/Seoul

      - name: 기록 커밋
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "newsroom-bot"
          git config user.email "bot@users.noreply.github.com"
          git add store/
          git diff --cached --quiet || (git commit -m "metrics: $(date +%F)" && git push)
